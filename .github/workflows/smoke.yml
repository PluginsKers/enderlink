name: Smoke

on:
  push:
    branches: [feat/multi-version]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21.11', '26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: |
            21
            25
          cache: gradle
      - name: Build
        run: ./gradlew --no-daemon --configure-on-demand :${{ matrix.minecraft }}:assemble
      - name: Smoke test
        env:
          MINECRAFT: ${{ matrix.minecraft }}
        run: |
          if [ "$MINECRAFT" = 1.21.11 ]; then java="$JAVA_HOME_21_X64/bin/java"; else java="$JAVA_HOME_25_X64/bin/java"; fi
          "$java" -version
          python3 .github/smoke.py "$MINECRAFT" "$java" versions/"$MINECRAFT"/build/libs/enderlink-*.jar
