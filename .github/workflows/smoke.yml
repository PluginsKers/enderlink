name: Smoke

on:
  push:
    branches: [feat/multi-version]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21.11', '26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: |
            21
            25
          cache: gradle
      - name: Probe repositories
        run: |
          marker=org/gradle/toolchains/foojay-resolver-convention/org.gradle.toolchains.foojay-resolver-convention.gradle.plugin/1.0.0/org.gradle.toolchains.foojay-resolver-convention.gradle.plugin-1.0.0.pom
          for base in https://maven.fabricmc.net https://maven.kikugie.dev/releases https://plugins.gradle.org/m2 https://repo.maven.apache.org/maven2 https://repo.papermc.io/repository/maven-public https://maven.aliyun.com/repository/public; do
            curl -sS -o /dev/null -m 60 -w "%{http_code} %{time_total}s $base\n" "$base/$marker" || echo "error $base"
          done
      - name: Build
        run: ./gradlew --no-daemon --configure-on-demand --stacktrace :${{ matrix.minecraft }}:assemble
      - name: Smoke test
        env:
          MINECRAFT: ${{ matrix.minecraft }}
        run: |
          if [ "$MINECRAFT" = 1.21.11 ]; then java="$JAVA_HOME_21_X64/bin/java"; else java="$JAVA_HOME_25_X64/bin/java"; fi
          "$java" -version
          python3 .github/smoke.py "$MINECRAFT" "$java" versions/"$MINECRAFT"/build/libs/enderlink-*.jar
