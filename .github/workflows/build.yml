name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Tag and publish the version in gradle.properties (main only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21.11', '26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=gradle.properties::Tag $GITHUB_REF_NAME does not match version=$version"
            exit 1
          fi
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build
        run: ./gradlew --no-daemon --configure-on-demand :${{ matrix.minecraft }}:assemble
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: enderlink-${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/build/libs/*.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.release && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: enderlink-*
          merge-multiple: true
          path: dist
      - name: Tag the version
        if: github.event_name == 'workflow_dispatch'
        run: |
          tag="v$(sed -n 's/^version=//p' gradle.properties)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${TAG:-$GITHUB_REF_NAME}"
          gh release create "$tag" dist/*.jar --verify-tag --title "$tag" --generate-notes
