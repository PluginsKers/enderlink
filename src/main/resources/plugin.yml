name: enderlink
version: '${version}'
main: com.eyreland.enderlink.EnderLinkPlugin
api-version: '26.2'
folia-supported: true
description: 'Portable ender chests with native capacity management'
author: PluginsKers
website: https://github.com/PluginsKers/enderlink

commands:
  enderlink:
    description: Open your ender chest, manage its capacity, or reload language files
    usage: '/enderlink [reload | size <online player> [27|36|45|54]]'

permissions:
  enderlink.open:
    description: Open your own ender chest
    default: true
  enderlink.reload:
    description: Reload language files
    default: op
  enderlink.size.query:
    description: Query ender chest capacity
    default: op
  enderlink.size:
    description: Change ender chest capacity
    default: false
    children:
      enderlink.size.query: true
